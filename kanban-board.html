<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMPA — Build Board</title>
  <style>
    :root {
      --bg: #14171a;
      --panel: #1b1f23;
      --card: #232830;
      --card-hover: #282e37;
      --border: #2f363d;
      --text: #e8e6e1;
      --text-muted: #8b939b;
      --text-faint: #5c646d;
      --accent: #4fd1c5;
      --accent-dim: #2f5c58;
      --done: #7fbf7f;
      --done-dim: #3a4a3a;
      --danger: #d97676;
      --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 32px 40px 60px;
    }

    .titlebar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .titlebar h1 {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0;
      color: var(--text);
    }

    .titlebar h1 .dim {
      color: var(--text-faint);
      font-weight: 400;
    }

    .titlebar .meta {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-faint);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .board {
        grid-template-columns: 1fr;
      }

      body {
        padding: 20px;
      }
    }

    .column {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      min-height: 200px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .column.drag-over {
      border-color: var(--accent);
      background: #1b2422;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 2px;
    }

    .column-header .label {
      font-family: var(--mono);
      font-size: 12.5px;
      letter-spacing: 0.03em;
    }

    .column[data-status="todo"] .label {
      color: var(--text-muted);
    }

    .column[data-status="progress"] .label {
      color: var(--accent);
    }

    .column[data-status="done"] .label {
      color: var(--done);
    }

    .column-header .count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1px 8px;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 40px;
    }

    .card-list:empty::after {
      content: attr(data-empty-text);
      display: block;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-faint);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 16px 10px;
      text-align: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 11px 9px;
      cursor: grab;
      transition: background 0.12s ease, transform 0.1s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .card:hover {
      background: var(--card-hover);
    }

    .card.dragging {
      opacity: 0.4;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-id {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-faint);
      letter-spacing: 0.02em;
    }

    .card-delete {
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      opacity: 0;
      transition: opacity 0.12s ease, color 0.12s ease;
    }

    .card:hover .card-delete {
      opacity: 1;
    }

    .card-delete:hover {
      color: var(--danger);
    }

    .card-title {
      font-size: 13.5px;
      line-height: 1.4;
      color: var(--text);
      outline: none;
    }

    .card-title:focus {
      background: var(--bg);
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
    }

    .card-tag {
      display: inline-block;
      margin-top: 7px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.02em;
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .card-tag[data-tag="project"] {
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    .card-tag[data-tag="study"] {
      color: #d9b96f;
      border-color: #4a4030;
    }

    .card-tag[data-tag="interview"] {
      color: #c98fd6;
      border-color: #40304a;
    }

    .card-time {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
    }

    .card-time input {
      width: 35px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 4px;
      outline: none;
    }

    .card-time input:focus {
      border-color: var(--accent);
      background: rgba(79, 209, 197, 0.05);
    }

    .card-time input::placeholder {
      color: var(--text-faint);
    }

    .card-time label {
      cursor: default;
    }

    .add-card-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .add-card-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 12.5px;
      padding: 7px 9px;
      outline: none;
    }

    .add-card-row input:focus {
      border-color: var(--accent);
    }

    .add-card-row input::placeholder {
      color: var(--text-faint);
    }

    .add-card-row button {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0 12px;
      cursor: pointer;
      transition: color 0.12s ease, border-color 0.12s ease;
    }

    .add-card-row button:hover {
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    .footer-note {
      margin-top: 28px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-note button {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 0;
    }

    .footer-note button:hover {
      color: var(--danger);
    }
  </style>
</head>

<body>

  <div class="titlebar">
    <h1>slot_machine_pattern_analyzer<span class="dim"> // build_board.local</span></h1>
    <div class="meta" id="savedMeta">not saved yet</div>
  </div>

  <div class="board">
    <div class="column" data-status="todo">
      <div class="column-header">
        <span class="label">// to do</span>
        <span class="count" id="count-todo">0</span>
      </div>
      <div class="card-list" id="list-todo" data-empty-text="drag a card here"></div>
      <div class="add-card-row">
        <input type="text" id="input-todo" placeholder="add a task…" />
        <button onclick="addCard('todo')">add</button>
      </div>
    </div>

    <div class="column" data-status="progress">
      <div class="column-header">
        <span class="label">// in progress</span>
        <span class="count" id="count-progress">0</span>
      </div>
      <div class="card-list" id="list-progress" data-empty-text="drag a card here to start it"></div>
      <div class="add-card-row">
        <input type="text" id="input-progress" placeholder="add a task…" />
        <button onclick="addCard('progress')">add</button>
      </div>
    </div>

    <div class="column" data-status="done">
      <div class="column-header">
        <span class="label">// done</span>
        <span class="count" id="count-done">0</span>
      </div>
      <div class="card-list" id="list-done" data-empty-text="nothing shipped yet"></div>
      <div class="add-card-row">
        <input type="text" id="input-done" placeholder="add a task…" />
        <button onclick="addCard('done')">add</button>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <span>drag cards between columns · click a card's text to edit it · saved to this browser's localStorage</span>
    <button onclick="resetBoard()">reset to default board</button>
  </div>

  <script>
    const STORAGE_KEY = 'smpa_kanban_board_v1';
    const TICKET_PREFIX = 'SMPA';

    const DEFAULT_CARDS = [
      // --- already shipped, from building the pipeline ---
      { title: 'schema.py — entities, enums, 5 designed personas', tag: 'project', status: 'done' },
      { title: 'generate_synthetic_data.py — simulator + RTP calibration fix', tag: 'project', status: 'done' },
      { title: 'feature_engineering.py — player-level behavioral features', tag: 'project', status: 'done' },
      { title: 'clustering.py — K-means + PCA + silhouette selection', tag: 'project', status: 'done' },
      { title: 'embedding_model.py — from-scratch autoencoder', tag: 'project', status: 'done' },
      { title: 'responsible_play.py — rule-based risk scoring', tag: 'project', status: 'done' },
      { title: 'recommendation_engine.py — cosine-similarity recommender', tag: 'project', status: 'done' },
      { title: 'dashboard.py + run_pipeline.py — Streamlit UI + orchestration', tag: 'project', status: 'done' },
      { title: 'Interview prep guide written', tag: 'interview', status: 'done' },
      { title: 'Study schedule scoped (2hrs/day, 2 weeks)', tag: 'study', status: 'done' },

      // --- remaining project work ---
      { title: 'Install streamlit + dependencies, test dashboard.py live', tag: 'project', status: 'todo' },
      { title: 'Add Results section to README (PCA plot, sample recs, risk-flag validation)', tag: 'project', status: 'todo' },
      { title: 'Clarify "embedding model" wording in README (learned vs. relabeled PCA)', tag: 'project', status: 'todo' },
      { title: 'Push all 10 scripts + requirements.txt to the GitHub repo', tag: 'project', status: 'todo' },
      { title: 'Add a screenshot/GIF of the dashboard to the README', tag: 'project', status: 'todo' },

      // --- study plan, in order ---
      { title: 'Day 1-2: rebuild feature_engineering.py from the docstring only', tag: 'study', status: 'todo' },
      { title: 'Day 3: probability refresher (expected value, variance, distributions)', tag: 'study', status: 'todo' },
      { title: 'Day 4: rebuild clustering.py from the docstring only', tag: 'study', status: 'todo' },
      { title: 'Day 6: sklearn user guide — StandardScaler, KMeans, PCA', tag: 'study', status: 'todo' },
      { title: 'Day 8-9: Karpathy "Neural Networks: Zero to Hero" (backprop videos)', tag: 'study', status: 'todo' },
      { title: 'Day 10: re-derive the autoencoder backward pass on paper', tag: 'study', status: 'todo' },
      { title: 'Day 11: recommender systems reading (cosine sim, two-tower)', tag: 'study', status: 'todo' },

      // --- interview prep ---
      { title: 'Day 13: full mock interview, out loud, using the prep guide', tag: 'interview', status: 'todo' },
      { title: 'Rehearse the RTP-bug story as a STAR answer', tag: 'interview', status: 'todo' },
      { title: 'Practice the 60-second project pitch until it\'s under 60 seconds', tag: 'interview', status: 'todo' },
    ];

    let state = { nextTicket: 1, cards: [] };

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          state = JSON.parse(raw);
          return;
        } catch (e) {
          console.warn('Could not parse saved board, resetting.', e);
        }
      }
      seedDefault();
    }

    function seedDefault() {
      state = { nextTicket: 1, cards: [] };
      DEFAULT_CARDS.forEach(c => {
        state.cards.push({
          id: crypto.randomUUID(),
          ticket: `${TICKET_PREFIX}-${String(state.nextTicket).padStart(2, '0')}`,
          title: c.title,
          tag: c.tag,
          status: c.status,
          timeEstimate: 0,
          timeActual: 0,
          startTime: null,
          endTime: null,
        });
        state.nextTicket += 1;
      });
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const meta = document.getElementById('savedMeta');
      meta.textContent = 'saved ' + new Date().toLocaleTimeString();
    }

    function render() {
      ['todo', 'progress', 'done'].forEach(status => {
        const list = document.getElementById(`list-${status}`);
        list.innerHTML = '';
        const cards = state.cards.filter(c => c.status === status);
        document.getElementById(`count-${status}`).textContent = cards.length;
        cards.forEach(card => list.appendChild(renderCard(card)));
      });
    }

    function renderCard(card) {
      const el = document.createElement('div');
      el.className = 'card';
      el.draggable = true;
      el.dataset.id = card.id;

      el.addEventListener('dragstart', () => {
        el.classList.add('dragging');
        el.dataset.dragging = 'true';
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
      });

      const top = document.createElement('div');
      top.className = 'card-top';

      const idSpan = document.createElement('span');
      idSpan.className = 'card-id';
      idSpan.textContent = card.ticket;

      const delBtn = document.createElement('button');
      delBtn.className = 'card-delete';
      delBtn.textContent = '×';
      delBtn.title = 'Delete card';
      delBtn.onclick = () => deleteCard(card.id);

      top.appendChild(idSpan);
      top.appendChild(delBtn);

      const title = document.createElement('div');
      title.className = 'card-title';
      title.contentEditable = 'true';
      title.spellcheck = false;
      title.textContent = card.title;
      title.addEventListener('blur', () => {
        const newTitle = title.textContent.trim();
        if (newTitle && newTitle !== card.title) {
          card.title = newTitle;
          saveState();
        } else {
          title.textContent = card.title;
        }
      });
      title.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); title.blur(); }
      });

      el.appendChild(top);
      el.appendChild(title);

      if (card.tag) {
        const tag = document.createElement('span');
        tag.className = 'card-tag';
        tag.dataset.tag = card.tag;
        tag.textContent = card.tag;
        el.appendChild(tag);
      }

      const timeDiv = document.createElement('div');
      timeDiv.className = 'card-time';

      const estInput = document.createElement('input');
      estInput.type = 'number';
      estInput.min = '0';
      estInput.step = '0.5';
      estInput.placeholder = '0';
      estInput.value = card.timeEstimate || 0;
      estInput.title = 'Estimated hours';
      estInput.addEventListener('change', () => {
        card.timeEstimate = parseFloat(estInput.value) || 0;
        saveState();
      });

      const estLabel = document.createElement('label');
      estLabel.textContent = 'est';

      const slash = document.createElement('span');
      slash.textContent = '/';
      slash.style.color = 'var(--text-faint)';

      const actDisplay = document.createElement('span');
      actDisplay.style.fontFamily = 'var(--mono)';
      actDisplay.style.fontSize = '11px';
      actDisplay.style.minWidth = '35px';

      // Update elapsed time display
      function updateElapsedTime() {
        if (card.status === 'progress' && card.startTime) {
          const elapsed = (Date.now() - card.startTime) / 1000;
          const hours = Math.floor(elapsed / 3600);
          const mins = Math.floor((elapsed % 3600) / 60);
          const secs = Math.floor(elapsed % 60);
          actDisplay.textContent = `${hours}h ${mins}m`;
          actDisplay.title = `Elapsed: ${hours}h ${mins}m ${secs}s`;
          actDisplay.style.color = 'var(--accent)';
          setTimeout(updateElapsedTime, 1000);
        } else if (card.status === 'done' && card.timeActual > 0) {
          const hours = Math.floor(card.timeActual);
          const mins = Math.round((card.timeActual % 1) * 60);
          actDisplay.textContent = `${hours}h ${mins}m`;
          actDisplay.style.color = 'var(--done)';
          actDisplay.title = `Total tracked time: ${card.timeActual.toFixed(2)} hours`;
        } else {
          actDisplay.textContent = '—';
          actDisplay.style.color = 'var(--text-faint)';
        }
      }

      updateElapsedTime();

      const actLabel = document.createElement('label');
      actLabel.textContent = 'auto';

      timeDiv.appendChild(estInput);
      timeDiv.appendChild(estLabel);
      timeDiv.appendChild(slash);
      timeDiv.appendChild(actDisplay);
      timeDiv.appendChild(actLabel);
      el.appendChild(timeDiv);

      return el;
    }

    function addCard(status) {
      const input = document.getElementById(`input-${status}`);
      const text = input.value.trim();
      if (!text) return;

      state.cards.push({
        id: crypto.randomUUID(),
        ticket: `${TICKET_PREFIX}-${String(state.nextTicket).padStart(2, '0')}`,
        title: text,
        tag: '',
        status,
        timeEstimate: 0,
        timeActual: 0,
        startTime: null,
        endTime: null,
      });
      state.nextTicket += 1;
      input.value = '';
      saveState();
      render();
    }

    function deleteCard(id) {
      state.cards = state.cards.filter(c => c.id !== id);
      saveState();
      render();
    }

    function resetBoard() {
      if (!confirm('Reset the board back to the default task list? This clears any edits.')) return;
      seedDefault();
      saveState();
      render();
    }

    function setupColumnDropZones() {
      document.querySelectorAll('.column').forEach(col => {
        const status = col.dataset.status;
        const list = col.querySelector('.card-list');

        col.addEventListener('dragover', (e) => {
          e.preventDefault();
          col.classList.add('drag-over');
        });
        col.addEventListener('dragleave', () => {
          col.classList.remove('drag-over');
        });
        col.addEventListener('drop', (e) => {
          e.preventDefault();
          col.classList.remove('drag-over');
          const draggingEl = document.querySelector('.card.dragging');
          if (!draggingEl) return;
          const id = draggingEl.dataset.id;
          const card = state.cards.find(c => c.id === id);
          if (card && card.status !== status) {
            const prevStatus = card.status;
            card.status = status;

            // Track time transitions
            if (prevStatus !== 'progress' && status === 'progress') {
              // Card moved TO progress: start timer
              card.startTime = Date.now();
            } else if (prevStatus === 'progress' && status === 'done') {
              // Card moved FROM progress TO done: stop timer and calculate
              if (card.startTime) {
                const elapsedMs = Date.now() - card.startTime;
                card.timeActual = elapsedMs / (1000 * 60 * 60);
                card.endTime = Date.now();
                card.startTime = null;
              }
            } else if (prevStatus === 'done' && status === 'progress') {
              // Card moved back to progress: restart timer
              card.startTime = Date.now();
              card.endTime = null;
            } else if (prevStatus === 'progress' && status !== 'progress' && status !== 'done') {
              // Card moved FROM progress to somewhere else: clear timer
              card.startTime = null;
              card.endTime = null;
            }

            saveState();
            render();
          }
        });
      });
    }

    ['todo', 'progress', 'done'].forEach(status => {
      document.getElementById(`input-${status}`).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addCard(status);
      });
    });

    loadState();
    setupColumnDropZones();
    render();
  </script>

</body>

</html>
